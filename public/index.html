<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Manager</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="header">Batch Manager</div>
<div class="batch-grid" id="batchGrid"></div>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="modalTitle">Batch Manage</h2>
        <div class="field"><label>Batch Name</label><input id="batchName" type="text"></div>
        <div class="field"><label>Time</label><input id="batchTime" type="time"></div>
        <div class="field"><label>Students</label><div id="studentList"></div></div>
        <div class="row"><input id="newStudent" type="text" placeholder="Student का नाम"><button class="btn-green" onclick="addStudent()">+ Add</button></div>
        <div class="note">Student के सामने Move से दूसरे Batch में भेज सकते हैं।</div>
        <div class="actions"><button class="btn-main" onclick="saveBatch()">Save</button><button class="btn-light" onclick="closeModal()">Close</button></div>
    </div>
</div>

<div class="overlay" id="profileOverlay">
    <div class="modal">
        <h2>Student Profile</h2>
        <div class="field"><label>Student Name</label><input id="profileStudentName" type="text"></div>
        <div class="field"><label>Batch</label><input id="profileBatch" type="text" disabled></div>
        <div class="field"><label>Time</label><input id="profileTime" type="text" disabled></div>
        <div class="field"><label>Position</label><input id="profilePosition" type="text" disabled></div>
        <div class="actions"><button class="btn-main" onclick="saveStudentProfile()">Save</button><button class="btn-light" onclick="closeStudentProfile()">Close</button></div>
    </div>
</div>

<div id="studentProfilePage">
    <div class="student-profile-topbar">
        <button class="student-profile-back" onclick="closeStudentProfilePage()">← Back</button>
        <div class="student-profile-heading">Student Profile</div>
    </div>
    <div class="student-profile-wrap">
        <div class="student-profile-card">
            <div class="student-profile-name">
                <strong id="pageStudentName">Student</strong>
                <span>Student Profile</span>
            </div>
            <div class="student-profile-info">
                <div class="student-profile-info-row"><div class="student-profile-info-label">Batch</div><div id="pageStudentBatch" class="student-profile-info-value">-</div></div>
                <div class="student-profile-info-row"><div class="student-profile-info-label">Time</div><div id="pageStudentTime" class="student-profile-info-value">-</div></div>
                <div class="student-profile-info-row"><div class="student-profile-info-label">Position</div><div id="pageStudentPosition" class="student-profile-info-value">-</div></div>
            </div>
        </div>
        <div class="student-profile-section">
            <div class="student-profile-section-title">Student Profile</div>
            <div class="student-profile-section-body">Student profile details यहाँ आगे जोड़े जाएंगे।</div>
        </div>
    </div>
</div>




<script src="script.js"></script>
</body>
</html>
