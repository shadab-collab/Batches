<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Manager</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#fff;
    padding:14px 16px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    border-bottom:1px solid #ddd;
}

.batch-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(135px,1fr));
    gap:12px;
    padding:14px;
    max-width:1400px;
    margin:auto;
    overflow-x:auto;
}

.batch{
    background:#fff;
    border:1px solid #d7d7d7;
    border-radius:10px;
    min-height:300px;
    overflow:hidden;
    cursor:pointer;
    transition:.15s;
}

.batch:active{
    transform:scale(.98);
}

.batch-head{
    background:#e9eef5;
    padding:12px 7px;
    text-align:center;
    border-bottom:1px solid #d5d9df;
}

.batch-name{
    font-size:14px;
    color:#555;
}

.batch-time{
    font-size:23px;
    font-weight:700;
    margin-top:3px;
    white-space:nowrap;
}

.students{
    padding:8px 7px;
}

.student{
    padding:7px 2px;
    border-bottom:1px solid #eee;
    font-size:17px;
    line-height:1.25;
    overflow-wrap:anywhere;
}

.student:last-child{
    border-bottom:0;
}

.serial{
    display:inline-block;
    min-width:25px;
    font-weight:600;
    color:#666;
}

.serial-manage{
    width:28px;
    font-weight:600;
    color:#666;
}

.empty{
    color:#aaa;
    text-align:center;
    padding:45px 5px;
    font-size:15px;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:10;
    align-items:flex-end;
    justify-content:center;
}

.modal{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:18px 18px 0 0;
    padding:18px;
    max-height:90vh;
    overflow:auto;
}

.modal h2{
    margin:0 0 15px;
    font-size:20px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:13px;
    color:#666;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    font-size:15px;
    cursor:pointer;
}

.btn-main{
    background:#1f2937;
    color:#fff;
}

.btn-light{
    background:#e5e7eb;
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-green{
    background:#16803c;
    color:#fff;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

.student-row{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.student-row .name{
    flex:1;
    font-size:15px;
}

.small-btn{
    padding:6px 9px;
    font-size:13px;
}

.note{
    font-size:12px;
    color:#777;
    margin-top:8px;
}


/* मोबाइल */
@media(max-width:800px){

    .batch-grid{
        grid-template-columns:repeat(5,145px);
        gap:10px;
        padding:12px;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }

    .batch{
        min-height:300px;
    }

    .student{
        font-size:17px;
        padding:7px 2px;
    }

    .batch-time{
        font-size:22px;
    }
}
</style>
</head>


<body>

<div class="header">
    Batch Manager
</div>


<div class="batch-grid" id="batchGrid"></div>


<!-- Manage Popup -->

<div class="overlay" id="overlay">

    <div class="modal">

        <h2 id="modalTitle">
            Batch Manage
        </h2>


        <!-- Batch Name -->

        <div class="field">

            <label>
                Batch Name
            </label>

            <input
                id="batchName"
                type="text"
            >

        </div>


        <!-- Time -->

        <div class="field">

            <label>
                Time
            </label>

            <input
                id="batchTime"
                type="time"
            >

        </div>


        <!-- Students -->

        <div class="field">

            <label>
                Students
            </label>

            <div id="studentList"></div>

        </div>


        <!-- Add Student -->

        <div class="row">

            <input
                id="newStudent"
                type="text"
                placeholder="Student का नाम"
            >

            <button
                class="btn-green"
                onclick="addStudent()"
            >
                + Add
            </button>

        </div>


        <div class="note">
            Student के सामने Move से दूसरे Batch में भेज सकते हैं।
        </div>


        <!-- Buttons -->

        <div class="actions">

            <button
                class="btn-main"
                onclick="saveBatch()"
            >
                Save
            </button>

            <button
                class="btn-light"
                onclick="closeModal()"
            >
                Close
            </button>

        </div>

    </div>

</div>



<script>

/* =====================================================
   DEFAULT BATCH DATA
===================================================== */

        students:[]

    },

    {

        students:[]
    },

    {

        time:"",
        students:[]
    },


    /* नीचे वाली Row */

    {

        time:"14:30",

        students:[
            "Sana",
            "Yusra",
            "Sidra",
            "Sarim",

            "Arif",

            "Affan",

        ]
    },


    {

        time:"15:30",

        students:[
            "Atif",
            "Kasif",
            "asad",
            "Sajid",
            "Wajid",
            "Ayaan",
            "Ayaan",
            "fatima",
            "Zohra",
            "Eeram",
            "piyush",
            "Zaid"
        ]
    },


    {
        name:"Batch 8",
        time:"16:30",

        students:[
            "Imran",
            "Sumaiya",
            "Sohail",
            "Arshad",
            "Kasif",
            "Abhiraaz",
            "Arisfa",
            "Misty",
            "Rishiraaz",
            "Arham",
            "Talib",
            "Tausif",
            "GuFran",
            "Neha",
            "Khadija"
        ]
    },


    {
        name:"Batch 9",
        time:"17:30",

        students:[
            "Surbhi",
            "Minsa",
            "Sadiya",
            "Saif",
            "Mariya",
            "Yusuf",
            "Rehan",
            "Adil",
            "Zikra",
            "Sayra",
            "Samya",
            "Nurfiya",
            "Aamna",
            "Ruhani"
        ]
    },


    {
        name:"Batch 10",
        time:"18:30",

        students:[
            "Yusuf",
            "Alsaba",
            "Atif",
            "Harish",
            "Arfa",
            "Ayaan",
            "Almas",
            "Salman",
            "Aman",
            "Aadil",
            "Raunak",
            "Raushan",
            "Arshalan",
            "Samreen",
            "Mahreen"
        ]
    }

];



/* =====================================================
   DATA VERSION
===================================================== */

const DATA_VERSION = "2";

let batches;


/*
   पहली बार या नई version होने पर
   default data load होगा
*/

if(
    localStorage.getItem("batchManagerDataVersion")
    !== DATA_VERSION
){

    batches = defaultBatches;

    localStorage.setItem(
        "batchManagerDataVersion",
        DATA_VERSION
    );

    localStorage.setItem(
        "batchManagerData",
        JSON.stringify(batches)
    );

}
else{

    batches =
        JSON.parse(
            localStorage.getItem("batchManagerData")
        )
        ||
        defaultBatches;

}



let currentBatch = null;



/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

    localStorage.setItem(
        "batchManagerData",
        JSON.stringify(batches)
    );

}



/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(t){

    if(!t){

        return "Time Set";

    }


    const [h,m] = t.split(":");

    let hour = Number(h);

    const ampm =
        hour >= 12
        ? "PM"
        : "AM";


    hour =
        hour % 12 || 12;


    return `${hour}:${m} ${ampm}`;

}



/* =====================================================
   MAIN SCREEN RENDER
===================================================== */

function render(){

    const grid =
        document.getElementById("batchGrid");


    grid.innerHTML = "";


    batches.forEach(
        (batch,index)=>{

            const box =
                document.createElement("div");


            box.className = "batch";


            box.onclick =
                ()=>openBatch(index);


            let students =
                batch.students
                .map(
                    (s,i)=>`

                    <div class="student">

                        <span class="serial">
                            ${i+1}.
                        </span>

                        ${escapeHtml(s)}

                    </div>

                    `
                )
                .join("");


            if(!students){

                students = `
                    <div class="empty">
                        कोई Student नहीं
                    </div>
                `;

            }


            box.innerHTML = `

                <div class="batch-head">

                    <div class="batch-name">
                        ${escapeHtml(batch.name)}
                    </div>

                    <div class="batch-time">
                        ${formatTime(batch.time)}
                    </div>

                </div>


                <div class="students">

                    ${students}

                </div>

            `;


            grid.appendChild(box);

        }
    );

}



/* =====================================================
   OPEN BATCH
===================================================== */

function openBatch(index){

    currentBatch = index;


    const b =
        batches[index];


    document.getElementById(
        "modalTitle"
    ).textContent =
        b.name + " Manage";


    document.getElementById(
        "batchName"
    ).value =
        b.name;


    document.getElementById(
        "batchTime"
    ).value =
        b.time;


    document.getElementById(
        "newStudent"
    ).value = "";


    renderStudents();


    document.getElementById(
        "overlay"
    ).style.display =
        "flex";

}



/* =====================================================
   CLOSE
===================================================== */

function closeModal(){

    document.getElementById(
        "overlay"
    ).style.display =
        "none";


    currentBatch = null;


    render();

}



/* =====================================================
   SAVE BATCH
===================================================== */

function saveBatch(){

    if(currentBatch === null){

        return;

    }


    const name =
        document.getElementById(
            "batchName"
        ).value.trim();


    const time =
        document.getElementById(
            "batchTime"
        ).value;


    if(name){

        batches[currentBatch].name =
            name;

    }


    batches[currentBatch].time =
        time;


    saveData();


    closeModal();

}



/* =====================================================
   ADD STUDENT
===================================================== */

function addStudent(){

    if(currentBatch === null){

        return;

    }


    const input =
        document.getElementById(
            "newStudent"
        );


    const name =
        input.value.trim();


    if(!name){

        return;

    }


    batches[
        currentBatch
    ].students.push(name);


    input.value = "";


    saveData();


    renderStudents();


    render();

}



/* =====================================================
   DELETE STUDENT
===================================================== */

function deleteStudent(index){

    if(currentBatch === null){

        return;

    }


    batches[
        currentBatch
    ].students.splice(
        index,
        1
    );


    saveData();


    renderStudents();


    render();

}



/* =====================================================
   MOVE STUDENT
===================================================== */

function moveStudent(index){

    if(currentBatch === null){

        return;

    }


    const student =
        batches[
            currentBatch
        ].students[index];


    const target =
        prompt(

            `Student: ${student}

किस Batch में Move करना है?

` +

            batches
                .map(
                    (b,i)=>

                        i === currentBatch
                        ? ""
                        :
                        `${i+1}. ${b.name} — ${formatTime(b.time)}`
                )
                .filter(Boolean)
                .join("\n")

            +

            `

Batch number लिखें (1-10):`

        );


    if(target === null){

        return;

    }


    const targetIndex =
        Number(target) - 1;


    if(

        !Number.isInteger(targetIndex)

        ||

        targetIndex < 0

        ||

        targetIndex >= batches.length

        ||

        targetIndex === currentBatch

    ){

        alert(
            "सही Batch number चुनें।"
        );

        return;

    }


    /* Target Batch में add */

    batches[
        targetIndex
    ].students.push(student);


    /* Current Batch से remove */

    batches[
        currentBatch
    ].students.splice(
        index,
        1
    );


    saveData();


    renderStudents();


    render();

}



/* =====================================================
   MANAGE STUDENTS RENDER
===================================================== */

function renderStudents(){

    const list =
        document.getElementById(
            "studentList"
        );


    const students =
        batches[
            currentBatch
        ].students;


    if(!students.length){

        list.innerHTML = `

            <div class="empty">
                कोई Student नहीं
            </div>

        `;

        return;

    }


    list.innerHTML =

        students
            .map(
                (s,i)=>`

                <div class="student-row">

                    <div class="serial-manage">
                        ${i+1}.
                    </div>


                    <div class="name">
                        ${escapeHtml(s)}
                    </div>


                    <button
                        class="small-btn btn-main"
                        onclick="moveStudent(${i})"
                    >
                        Move
                    </button>


                    <button
                        class="small-btn btn-danger"
                        onclick="deleteStudent(${i})"
                    >
                        Delete
                    </button>

                </div>

                `
            )
            .join("");

}



/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHtml(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =====================================================
   CLOSE WHEN CLICK OUTSIDE
===================================================== */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        e=>{

            if(
                e.target.id === "overlay"
            ){

                closeModal();

            }

        }
    );



/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
